site_name: ChemWorld
site_description: Programmable chemical worlds for controlled, replayable agent experimentation.
site_url: https://knitua.github.io/ChemWorld-Public/
repo_url: https://github.com/Knitua/ChemWorld-Public
repo_name: Knitua/ChemWorld-Public
edit_uri: edit/main/docs/
copyright: ChemWorld · Software-model experiments, not instructions for physical laboratory work

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          site_description: 用于受控、可回放 Agent 实验的可编程化学世界。
          copyright: ChemWorld · 软件模型实验环境，不用于指导真实化学实验
          nav_translations:
            Home: 首页
            Try ChemWorld: 体验 ChemWorld
            Live Student Lab: 在线学生实验台
            Agent Observatory: Agent 观测台
            One Complete Experiment: 一次完整实验
            Notebooks: Notebook 教程
            Getting Started: 快速开始
            Research Thesis: 研究主张
            Why ChemWorld: 为什么是 ChemWorld
            Experimental Intelligence: 实验智能
            Causal Worlds: 因果世界
            System Model: 系统模型
            Worlds & Tasks: 世界与任务
            Showcase Worlds: 展示世界
            Confirmatory Tasks: 确认性任务
            Agents & Evaluation: Agent 与评估
            Agent Tracks: Agent 交互层级
            Build an Agent: 构建 Agent
            Benchmark Design: Benchmark 设计
            Evidence & Bridge: 证据与桥接
            Evidence & Current Status: 证据与当前状态
            Real-world Bridge: 真实世界桥接
            Limitations: 适用边界
            Reference: 参考
            API Reference: API 参考
            Deploy the Lab: 部署实验室

extra_css:
  - assets/stylesheets/site.css

extra_javascript:
  - assets/javascripts/experiment-explorer.js

nav:
  - Home: index.md
  - Try ChemWorld:
      - Live Student Lab: student-lab.md
      - Agent Observatory: agent-observatory.md
      - One Complete Experiment: one-experiment.md
      - Notebooks: notebooks.md
      - Getting Started: getting-started.md
  - Research Thesis:
      - Why ChemWorld: vision.md
      - Experimental Intelligence: experimental-intelligence.md
      - Causal Worlds: causal-worlds.md
      - System Model: architecture.md
  - Worlds & Tasks:
      - Showcase Worlds: worlds.md
      - Confirmatory Tasks: confirmatory-tasks.md
  - Agents & Evaluation:
      - Agent Tracks: agent-tracks.md
      - Build an Agent: agents.md
      - Benchmark Design: benchmark-design.md
  - Evidence & Bridge:
      - Evidence & Current Status: evidence.md
      - Real-world Bridge: real-world-bridge.md
      - Limitations: limitations.md
  - Reference:
      - API Reference: reference.md
      - Deploy the Lab: deployment.md

strict: true
