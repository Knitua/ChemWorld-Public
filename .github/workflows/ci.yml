name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify release boundary
        run: python scripts/verify_release.py
      - name: Lint
        run: ruff check src tests scripts examples
      - name: Type check
        run: mypy src/chemworld
      - name: Test
        run: pytest -q

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/chemworld-wheel"
          "$RUNNER_TEMP/chemworld-wheel/bin/python" -m pip install dist/*.whl
      - name: Run installed-package smoke test
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/chemworld-wheel/bin/python" - <<'PY'
          import gymnasium as gym
          import chemworld

          assert chemworld.__version__ == "0.3.1"
          env = gym.make("ChemWorld", task_id="reaction-to-assay", seed=0)
          _, info = env.reset(seed=0)
          assert info["task_id"] == "reaction-to-assay"
          assert "add_solvent" in env.unwrapped.available_actions()
          env.close()
          PY
