name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify release boundary
        run: python scripts/verify_release.py
      - name: Lint
        run: ruff check src tests scripts examples
      - name: Type check
        run: mypy src/chemworld
      - name: Test
        run: pytest -q

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/chemworld-wheel"
          "$RUNNER_TEMP/chemworld-wheel/bin/python" -m pip install dist/*.whl
      - name: Run installed-package smoke test
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/chemworld-wheel/bin/python" - <<'PY'
          import gymnasium as gym
          import chemworld
          from importlib.resources import files

          assert chemworld.__version__ == "0.4.0"
          assert files("chemworld.lab").joinpath("static", "index.html").is_file()
          env = gym.make("ChemWorld", task_id="reaction-to-assay", seed=0)
          _, info = env.reset(seed=0)
          assert info["task_id"] == "reaction-to-assay"
          assert any(
              action["operation"] == "add_solvent"
              for action in env.unwrapped.available_actions()
          )
          env.close()
          PY

  public-lab-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build provider-free Lab image
        run: docker build --tag chemworld-public-lab:test .
      - name: Start bounded public service
        run: docker run --detach --name chemworld-public-lab --publish 10000:10000 chemworld-public-lab:test
      - name: Verify health and public boundary
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = "http://127.0.0.1:10000/api/health"
          for _ in range(60):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      payload = json.load(response)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("public Lab container did not become healthy")

          assert payload == {
              "provider_required": False,
              "public_mode": True,
              "release": "0.4.0",
              "status": "ok",
          }
          PY
      - name: Show logs after failure
        if: failure()
        run: docker logs chemworld-public-lab
      - name: Stop service
        if: always()
        run: docker rm --force chemworld-public-lab
